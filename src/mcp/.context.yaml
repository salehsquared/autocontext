scope: src/mcp
summary: MCP server (stdio transport) + 12 tools grouped by intent (discover / read / navigate / analyze / assemble). Capability resource at autocontext://capabilities.
decisions:
  - what: "All four v1 MCP tools preserve their output contracts byte-for-byte"
    why: "Existing MCP clients (Claude Code, Cursor, Windsurf) parse the current shapes. The compat snapshot in tests/mcp/compat.test.ts guards this across releases."
  - what: "New navigation tools hard-fail on INDEX_MISSING instead of auto-rebuilding"
    why: "An MCP call that takes >30s to rebuild the index is indistinguishable from a hang to most clients. Agents surface the remediation to the user."
  - what: "find_references returns import-bound references only"
    why: "Pinned reference_kind: \"import_bound\" + caveat string on every response. A zero result is not proof of zero callers — this honesty beats silent inaccuracy."
  - what: "10 KB serialized response ceiling on nav tools via binary-search truncation"
    why: "Large responses are both expensive and usually noisy. Forces agents to narrow via scope/limit."
constraints:
  - "Breaking changes to query_context / check_freshness / list_contexts / aggregate_evidence require a tools_version bump and are guarded by tests/mcp/compat.test.ts."
  - "find_references response metadata must always include reference_kind: \"import_bound\" and the pinned caveat string."
  - "No MCP handler ever rebuilds the index, runs the LLM, or shells out to user commands."
