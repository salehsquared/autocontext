scope: src/index
summary: Local symbol / reference / import-edge graph store. Pluggable IndexStore backed by NDJSON under .autocontext/index/. Powers pack ranking, impact, semantic staleness, policies, and MCP navigation.
decisions:
  - what: "NDJSON backend, not SQLite"
    why: "Zero native deps — matches the `web-tree-sitter` (WASM) + pure-JS discipline the rest of autocontext follows. IndexStore is a pluggable interface; a SQLite backend can ship as an additive option later."
  - what: "Import-bound references only"
    why: "Precision ≥ 0.95 / 0.90 on TS-JS / Python fixtures with recall ≥ 0.70. Free-identifier resolution would widen recall at the cost of unpredictable precision. Every consumer of references (find_references, impact, bench ground truth) pins this boundary."
  - what: "INDEX_VERSION decoupled from SCHEMA_VERSION"
    why: "Index layout can evolve quickly without touching the .context.yaml contract users commit to git. A mismatch triggers a rebuild."
  - what: "Sharded NDJSON by top-level directory"
    why: "Lets readers stream a subset without loading the whole index. Keeps per-shard size bounded for large monorepos."
constraints:
  - "v1 stores import-bound references only; do not add call-expression or member-access references without bumping INDEX_VERSION and widening the precision caveat."
  - "No native dependencies. Analyzer queries must run on `web-tree-sitter` (WASM)."
  - "Go and Rust analyzers are deferred — ship the grammars but do not synthesize reference rows until the analyzers land."
maintenance: |-
  If you modify files in this directory, update this .context.yaml to reflect
  your changes. Update the summary, and any decisions or constraints that changed.
  Do NOT update the fingerprint manually — run `context rehash` or it will be
  updated automatically on the next `context status` check.
  If you only read files in this directory, do not modify this file.
  Do not include secrets, API keys, passwords, or PII in this file.
