decisions:
  - what: Typed discriminated-union objects, not a DSL
    why: DSL-style policy languages (Rego, jsonnet, etc.) ship with a parser, sandbox, and learning curve. Seven typed kinds
      cover the violations that actually show up in practice; adding an eighth is a Zod line + an evaluator file.
  - what: Subtree scope semantics — rules apply to the declaring directory and all descendants
    why: Most rules are project-wide. Inheritance from the root keeps boilerplate down; users tighten via the rule's `from`
      glob or by moving the rule deeper.
  - what: symbol_kind on require_export, not kind
    why: Avoids collision with the Zod discriminator field. Naming this anything else would break the discriminated-union
      parse.
constraints:
  - Rule shapes must match the existing evidence enum values exactly. evidence_requires.typecheck = "clean" (not
    "passing"); the conformance fixture bad-evidence-requires-typecheck.yaml locks this.
  - Evaluators stream from IndexStore.scanImports() — never load the full graph into memory.
  - "MCP check_policies caps violations at 500; bigger results truncate with `truncated: true` (no silent loss)."
