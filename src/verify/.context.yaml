decisions:
  - what: context verify is strictly opt-in and never auto-runs
    why: Running arbitrary user commands from a tool that agents invoke would be a security footgun. Only the explicit
      `context verify` invocation calls runVerifyCommand; a no-auto-run lint test guards this.
  - what: Atomic write via temp + rename on the same filesystem
    why: Ctrl-C mid-run must not leave a partial .context.yaml. POSIX rename is atomic when source and target share a
      filesystem (always true here since both live in the scope's directory).
  - what: 5 MiB stream cap with truncation footer
    why: Misconfigured runners can print every test name. Capping bounds memory; the footer makes truncation visible to the
      parser.
constraints:
  - context verify must never be called transitively from init, regen, watch, doctor, MCP handlers, or pre-commit hooks.
    The no-auto-run lint at tests/verify/no-auto-run.test.ts asserts this for each callsite.
  - 'Spawn always uses { stdio: ["ignore", "pipe", "pipe"] } so commands cannot block waiting for stdin prompts.'
  - "Timeout escalation: SIGTERM, then SIGKILL after 5 s. Never block forever."
