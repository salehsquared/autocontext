subdirectories:
  - name: bench/
    summary: Benchmark harness — five comparator arms (baseline / context / pack / pack+impact / pack+policy),
      index-grounded ground-truth, and BenchProvenance pinning.
  - name: cache/
    summary: Content-addressed LLM response cache at `.autocontext/llm-cache/`. Sharded layout, deterministic keys.
  - name: commands/
    summary: CLI command implementations.
  - name: core/
    summary: Core functionality.
  - name: generator/
    summary: Code generation.
  - name: impact/
    summary: Documentation.
  - name: index/
    summary: Local symbol / reference / import-edge graph store. Pluggable IndexStore backed by NDJSON under
      .autocontext/index/. Powers pack ranking, impact, semantic staleness, policies, and MCP navigation.
  - name: mcp/
    summary: MCP server (stdio transport) + 12 tools grouped by intent (discover / read / navigate / analyze / assemble).
      Capability resource at autocontext://capabilities.
  - name: pack/
    summary: Source directory.
  - name: policy/
    summary: Source directory.
  - name: providers/
    summary: Abstract LLM provider interface.
  - name: utils/
    summary: Utility functions.
  - name: verify/
    summary: Active-verification orchestrator + nine output normalizers
      (vitest/jest/junit/go-test/tsc/eslint/istanbul/pytest-cov/exit-code). Spawns the user's configured commands and
      writes evidence atomically.
  - name: view/
    summary: Source directory.
