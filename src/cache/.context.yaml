scope: src/cache
summary: Content-addressed LLM response cache at `.autocontext/llm-cache/`. Sharded layout, deterministic keys.
maintenance: |-
  If you modify files in this directory, update this .context.yaml to reflect
  your changes. Update the summary, and any decisions or constraints that changed.
  Do NOT update the fingerprint manually — run `context rehash` or it will be
  updated automatically on the next `context status` check.
  If you only read files in this directory, do not modify this file.
  Do not include secrets, API keys, passwords, or PII in this file.
decisions:
  - what: Cache key includes PROMPT_TEMPLATE_VERSION
    why: Bumping the template version invalidates every entry instead of leaving stale prompt/response pairs around. Cache
      misses are cheap; stale hits are expensive.
  - what: Cache key also pins provider name + model
    why: Same prompt to claude-3-5-haiku-latest vs claude-opus-4-6 produces different responses. Cross-model contamination
      would be silent.
constraints:
  - Never cache errors, rate-limit responses, streaming responses, or empty responses. Only successful, complete
    completions.
  - Cache files are content-addressed — never write outside the sharded directory layout. Bypassing the layout breaks
    `context cache stats` / `clear`.
dependencies:
