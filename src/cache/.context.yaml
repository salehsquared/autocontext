  - "async function cacheGet( projectRoot: string, key: string, ): Promise<CacheEnvelope | null>"
  - "async function cachePut( projectRoot: string, envelope: CacheEnvelope, ): Promise<void>"
  - "async function cacheClear(projectRoot: string): Promise<number>"
  - "async function cacheStats(projectRoot: string): Promise<CacheStats>"
  - "function isCacheEnabled(): boolean"
  - "function computeCacheKey(inputs: CacheKeyInputs): string"
  - "function sha256Hex(s: string): string"
